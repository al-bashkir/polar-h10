[project]
name = "h10-analysis"
version = "0.1.0"
description = "Data-integrity-first analysis of Polar H10 sessions recorded by h10"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "matplotlib>=3.8",
]

[project.scripts]
h10-analyze = "h10_analysis.cli:analyze_main"
h10-compare = "h10_analysis.cli:compare_main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h10_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["h10_analysis", "synth"]
